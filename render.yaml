services:
  - type: web
    name: audio-visualizer
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y ffmpeg || true
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
    disk:
      name: visualizer-storage
      mountPath: /data
      sizeGB: 1
